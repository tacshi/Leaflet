name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "speech/**"
      - "mobile/**"
      - "internal/**"
      - "locales/**"
      - "supabase/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "speech/**"
      - "mobile/**"
      - "internal/**"
      - "locales/**"
      - "supabase/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Keep MyGo's windowing packages out of the iOS core
        run: ios/scripts/check-core-deps.sh

  lint:
    name: Swift lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SwiftLint at the commit of its 0.65.1 tag, built as Homebrew builds it.
      # The build takes minutes, so the binary is kept for the next runs, by
      # that commit and the Swift toolchain that built it. It is saved as soon
      # as it is built, so a run whose lint fails keeps it too.
      - name: Find the Swift toolchain
        id: toolchain
        run: echo "swift=$(xcrun swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - name: Restore SwiftLint
        id: swiftlint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/swiftlint-bin
          key: swiftlint-6aba03e3d8302b33f106e0f922210f35ca4b52cf-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.swift }}
      - name: Build SwiftLint 0.65.1
        if: steps.swiftlint.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch 0.65.1 -c advice.detachedHead=false \
            https://github.com/realm/SwiftLint.git "$RUNNER_TEMP/SwiftLint"
          test "$(git -C "$RUNNER_TEMP/SwiftLint" rev-parse HEAD)" = 6aba03e3d8302b33f106e0f922210f35ca4b52cf
          swift build --package-path "$RUNNER_TEMP/SwiftLint" --configuration release --product swiftlint
          mkdir -p "$RUNNER_TEMP/swiftlint-bin"
          cp "$RUNNER_TEMP/SwiftLint/.build/release/swiftlint" "$RUNNER_TEMP/swiftlint-bin/"
      - name: Save SwiftLint
        if: steps.swiftlint.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/swiftlint-bin
          key: ${{ steps.swiftlint.outputs.cache-primary-key }}
      - name: Use SwiftLint
        run: |
          echo "$RUNNER_TEMP/swiftlint-bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint-bin/swiftlint" version
      # The files make ios-check lints.
      - name: swift-format
        working-directory: ios
        run: |
          find Leaflet Shared Widgets LeafletTests ../speech -name '*.swift' -not -path '*/Generated/*' \
            -not -path '../speech/.build/*' -print0 |
            xargs -0 xcrun swift-format lint --strict --configuration .swift-format
      - name: SwiftLint
        working-directory: ios
        run: swiftlint lint --strict --quiet
