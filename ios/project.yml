name: Leaflet
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  Highlightr:
    url: https://github.com/raspu/Highlightr
    exactVersion: 2.3.0
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw
    exactVersion: 0.29.0
  DeviceKit:
    url: https://github.com/devicekit/DeviceKit
    exactVersion: 5.10.0
  LeafletSpeech:
    path: ../speech
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Leaflet:
    type: application
    platform: iOS
    sources:
      - path: Leaflet
      - path: Shared
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Leaflet/Sync/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [fetch, audio]
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers: ["$(PRODUCT_BUNDLE_IDENTIFIER).sync"]
    entitlements:
      path: Config/Leaflet.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:leaflet-auth.capyvibe.app
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - framework: build/LeafletCore.xcframework
        embed: false
      - package: Highlightr
      - package: SwiftDraw
      - package: DeviceKit
      - package: LeafletSpeech
      - target: LeafletWidgets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Leaflet records audio into recording blocks when you press Record.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Leaflet connects to the AI models and speech-to-text servers you set up on your local network.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        OTHER_LDFLAGS: -lresolv
  LeafletWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: LeafletWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGETS
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.capyvibe.leaflet.debug.widgets
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.capyvibe.leaflet.widgets
  LeafletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeafletTests
    dependencies:
      - target: Leaflet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.capyvibe.leaflet.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Leaflet:
    build:
      targets:
        Leaflet: all
    test:
      targets:
        - LeafletTests
