name: CI

# The iOS app's own sources are checked by ios.yml; the Go core it links
# is checked here as well, and so is ios/gen, which is Go in this module.
on:
  push:
    branches: [main]
    paths: ["**", "!ios/**", "ios/gen/**"]
  pull_request:
    paths: ["**", "!ios/**", "ios/gen/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Build for Windows
        run: GOOS=windows go build ./...
      - name: Test
        run: go test ./...
      - name: Vet the app
        run: go tool mygo vet .
      # The Windows-only files are compiled above, and vetted here.
      - name: Vet for Windows
        run: GOOS=windows go vet ./...
      - name: Check the locale catalogs
        run: go tool mygo i18n check
      # locales/catalog_gen.go is written from the catalogs: a catalog
      # changed without it fails here.
      - name: Check the catalogs' accessors are generated
        run: |
          go tool mygo generate
          git diff --exit-code -- locales/catalog_gen.go

  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Install govulncheck and gosec
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - name: make check
        run: make check
      - name: Lint for Windows
        run: GOOS=windows golangci-lint run --no-config ./...

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type-check
        run: deno check */index.ts
      - name: Test
        run: deno test _shared/

  # The app applies these to each person's own Supabase project, so each
  # is applied here, oldest first, on the Postgres image those projects run.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply and check the migrations
        run: scripts/check-migrations.sh

  worker:
    name: Sign-in Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Test
        run: deno test --allow-net src/
